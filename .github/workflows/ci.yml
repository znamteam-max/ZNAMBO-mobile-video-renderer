name: CI build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend and Worker
        run: npm run build
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Check FFmpeg
        run: ffmpeg -version
      - name: Python syntax check
        run: python -m py_compile renderer/server.py renderer/render_cli.py renderer/brand_assets.py renderer/v2_overlay.py renderer/smoke_test.py
      - name: Validate exact sponsor PNG assets
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path
          expected = {
              Path('public/brand/winline.png'): (215, 53),
              Path('public/brand/difference.png'): (325, 49),
          }
          for path, size in expected.items():
              raw = path.read_bytes()
              assert raw[:8] == b'\x89PNG\r\n\x1a\n'
              width, height = struct.unpack('>II', raw[16:24])
              assert (width, height) == size
              print(path, width, height)
          PY
      - name: FFmpeg render smoke test
        run: python renderer/smoke_test.py
